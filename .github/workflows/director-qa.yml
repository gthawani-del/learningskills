name: Director QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: director-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIRECTOR_CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-qa.txt
      - name: Install existing QA dependencies
        run: |
          npm ci
          python -m pip install -r requirements-qa.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Full release QA
        run: |
          "$DIRECTOR_CHROMIUM_PATH" --version
          npm run qa
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-qa-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
