function production(){return `${nav('Production')}<main class="screen studio"><aside class="left"><div class="left-head"><h2>The Last Train</h2><span class="head-muted">60-second film</span></div><div class="left-scroll"><div class="category">Scenes <span>4</span></div>${scenes()}<div class="category">Cast &amp; world <span>Open library</span></div><div class="assets"><div class="asset"><img src="${I('portrait')}"/><div>Meera</div></div><div class="asset"><img src="${I('family')}"/><div>Family</div></div><div class="asset"><img src="${I('station')}"/><div>Station</div></div></div><div class="category">Reference assets</div><div class="asset-pill">▧ &nbsp; Screenplay.pdf &nbsp; · &nbsp; Script</div><div class="asset-pill">◈ &nbsp; Meera_reference.jpg</div><div class="asset-pill">◧ &nbsp; Station_reference.jpg</div><div class="category">Production state</div><div class="asset-pill">Approved scenes preserved</div><div class="asset-pill">Shot 06: awaiting review</div></div></aside><section class="canvas"><div class="canvas-head"><span>Scene 03 &nbsp; / &nbsp; <b>Shot 06 · The goodbye</b></span><div class="toolrow"><button class="tool" onclick="notify('Demo: take comparison pending')">Compare takes</button><button class="tool" onclick="showModal()">Request change</button><span class="badge">Generated · review pending</span></div></div><div class="activity is-hidden" id="activity">Activity: generation completed · source retrieved · visual review pending. No internal model reasoning is shown.</div><div class="viewer"><div class="film" style="background-image:url('${I('goodbye')}')"></div><div class="film-overlay"></div><div class="film-caption">Take 02 &nbsp; · &nbsp; Medium close-up &nbsp; · &nbsp; 6 seconds</div><button class="viewer-play" onclick="notify('Demo still: video playback is not connected')">▶</button><div class="playerbar"><span>▶</span><span>00:18 / 00:24</span><div class="track"></div><span>◱</span></div></div><div class="timeline"><div class="tl-title"><span>Shot sequence · Scene 03</span><span class="dim">Select a take to review</span></div><div class="frames">${['arrival','family','goodbye','goodbye','station','departure'].map((a,i)=>`<div class="frame ${i===3?'active':''}"><img src="${I(a)}"/><em>0${i+1}</em></div>`).join('')}</div><div class="audio"></div></div></section><aside class="agent"><div class="agent-top"><div class="agent-title"><span class="agent-badge">✦</span><div><h2>Creative Director</h2><div class="head-muted">Shot 06 selected · text and voice</div></div></div><button class="tool" onclick="toggleActivity()">View Activity</button></div><div class="agent-discussion"><div class="bubble b-assistant">The selected take follows the approved camera position. The emotional performance still needs your review.</div><div class="bubble b-user">Keep the camera angle. Her reaction should be more restrained.</div><div class="bubble b-assistant">I can prepare a targeted correction for this take. I will preserve framing and approved identity; any paid attempt needs your approval.</div><div class="context"><b>Current selection</b><div class="context-note">Scene 03 · Shot 06 · Take 02<br/>Constraints: medium close-up, identity preserved, restrained performance<br/>Cost estimate: not available until a verified route is selected</div></div></div><div class="composer"><div class="attached-list" id="chips">${refsHTML()}</div><div class="compose-box"><textarea id="composerInput" aria-label="Message the Director" placeholder="Ask Director... Type / for skills, @ for assets"></textarea><div class="compose-controls"><div class="control-group"><button class="circle" aria-label="Add reference" onclick="toggleMenu('attach')">+</button><button class="circle" aria-label="Find a skill" onclick="openSkills()">/</button><button class="circle" aria-label="Mention project asset" onclick="toggleMenu('refs')">@</button></div><div class="control-group"><button class="circle" aria-label="Voice input" onclick="voiceHint()">♩</button><button class="circle submit" aria-label="Send request" onclick="send()">↑</button></div></div></div><div class="statusline">Skill selection does not start a paid job. Generated revisions require authorization.</div><div id="skillMenu" class="slash-menu is-hidden"></div><div id="attachMenu" class="attach-menu is-hidden"></div><div id="refsMenu" class="refs-menu is-hidden"></div></div></aside></main>`}
function brief(){return `${nav('Creative briefing')}<main class="screen brief"><aside class="brief-side"><div class="head-muted" style="margin:0 0 13px 13px;font-weight:700;text-transform:uppercase">Create a film</div>${[['01','Creative brief'],['02','Story development'],['03','Cast & world'],['04','Storyboard'],['05','Production'],['06','Edit & review']].map(([n,s],i)=>`<div class="br-item ${i==0?'sel':''}"><i>${n}</i>${s}</div>`).join('')}<div class="info-text" style="margin:28px 14px">Each approved step is versioned. You can revisit earlier decisions without losing approved outputs.</div></aside><section class="brief-main"><div class="brief-title"><h1>Tell me about your film.</h1><p>Speak naturally, type your idea, or attach a script, song or visual reference.</p></div><div class="brief-messages"><div class="msg guide"><span class="who">CREATIVE DIRECTOR</span>What would you like to make? Start with a sentence, or upload something you've already created.</div><div class="msg person">A 60-second emotional story about an Indian soldier saying goodbye to his family.</div><div class="msg guide"><span class="who">CREATIVE DIRECTOR</span>Would you like the goodbye at home, at a railway station, or through a phone call?</div><div class="msg person">A railway station. Realistic and understated.</div><div class="msg guide"><span class="who">CREATIVE DIRECTOR</span>Understood. We can use your references to develop the characters and location without changing the approved story direction.</div></div><div class="brief-entry"><div class="attached-list" id="chips">${refsHTML()}</div><textarea id="composerInput" placeholder="Add details... Type / for skills, @ to mention a reference"></textarea><div class="brief-composer-actions"><div style="display:flex;gap:6px"><button class="br-act" onclick="toggleMenu('attach')">＋ Attach</button><button class="br-act" onclick="openSkills()">/ Skills</button><button class="br-act" onclick="toggleMenu('refs')">@ References</button><button class="br-act" onclick="voiceHint()">♩ Voice</button></div><button class="btn primary" onclick="send()">Send</button></div><div class="statusline" style="color:#7b8894">Uploads remain private. No video generation starts from a message alone.</div><div id="skillMenu" class="slash-menu is-hidden" style="bottom:124px;left:34px;right:410px"></div><div id="attachMenu" class="attach-menu is-hidden" style="bottom:124px;left:34px;right:410px"></div><div id="refsMenu" class="refs-menu is-hidden" style="bottom:124px;left:34px;right:410px"></div></div></section><aside class="brief-aside"><div class="aside-cover" style="background-image:url('${I('station')}')"><div class="aside-photo-label">The Last Train</div></div><div class="aside-body"><h2>Film brief · Draft</h2>${[['Format','Short film'],['Duration','60 seconds'],['Setting','Railway station'],['Emotional direction','Realistic, restrained'],['Next','Review story treatment']].map(([a,b])=>`<div class="property"><span>${a}</span><b>${b}</b></div>`).join('')}<h2 style="margin-top:24px">References</h2><div class="ref-mini"><img src="${I('portrait')}"/>Character Identity · Meera_reference.jpg</div><div class="ref-mini">▣ &nbsp; Script / Dialogue · Screenplay.pdf</div><p class="info-text">Reference roles define what should be preserved. The final film plan remains editable until approval.</p><button class="btn primary" onclick="notify('Demo: move to story development')">Continue to story →</button></div></aside></main>`}
function mobile(){return `<main class="screen mobile"><div class="m-top"><span>‹ &nbsp; The Last Train</span><span style="color:#aebbc9">Shot 06 of 12 &nbsp; ···</span></div><div class="m-summary">Scene 03 · The goodbye &nbsp; <span style="float:right">Needs review</span></div><div class="m-media" style="background-image:url('${I('goodbye')}')"><span>Take 02 · 00:18–00:24</span></div><div class="m-tabs"><span>Review</span><span class="active">Talk to Director</span><span>References</span></div><div class="m-context">Keep the camera at eye level. The emotional performance should be restrained. Approved identity and wardrobe remain fixed.</div><div class="m-sheet"><div class="handle"></div><div class="m-composer-head"><b>Tell Director what to change</b><span style="color:#b6c3cf">Selected shot ↗</span></div><div id="chips" class="m-uploader">${refsHTML()}</div><textarea class="m-input" id="composerInput" placeholder="Describe a change, or type / to use a skill..."></textarea><div class="m-actions"><button aria-label="Attach file" onclick="toggleMenu('attach')">＋ Attach</button><button aria-label="Choose skill" onclick="openSkills()">/ Skills</button><button aria-label="Reference asset" onclick="toggleMenu('refs')">@</button><button aria-label="Start voice" onclick="voiceHint()">♩</button><button class="send" aria-label="Send message" onclick="send()">↑</button></div><div class="m-instruction">Voice and text use the selected-shot context. Review any paid action before it runs.</div><div id="skillMenu" class="sheet-list is-hidden"></div><div id="attachMenu" class="sheet-list is-hidden"></div><div id="refsMenu" class="sheet-list is-hidden"></div></div></main>`}
function mobileSkill(){return mobile()};
function setup(){const inp=document.getElementById('composerInput');if(!inp)return;inp.addEventListener('input',()=>{let v=inp.value;const match=v.match(/(?:^|\s)\/[a-z-]*$/i);if(match){menu('skill',match[0].trim().substring(1))}else hideAll()});inp.addEventListener('keydown',e=>{if(e.key==='Escape')hideAll();if(e.key==='Enter'&&document.getElementById('skillMenu')&&!document.getElementById('skillMenu').classList.contains('is-hidden')){e.preventDefault();const x=document.querySelector('#skillMenu .menu-item');if(x)x.click()}});if(screen==='mobile-skills'){inp.value='/';menu('skill','')} if(screen==='mobile-attach'){menu('attach')}}
function hideAll(){['skillMenu','attachMenu','refsMenu'].forEach(id=>document.getElementById(id)?.classList.add('is-hidden'))}
function menu(type,q=''){hideAll();const id=type==='skill'?'skillMenu':type==='attach'?'attachMenu':'refsMenu';const el=document.getElementById(id);if(!el)return;el.classList.remove('is-hidden');if(type==='skill'){let matches=skillData.filter(s=>s[0].includes(q.toLowerCase())||s[1].toLowerCase().includes(q.toLowerCase()));el.innerHTML=`<div class="menu-head">Skills · type to filter</div>`+matches.map(s=>`<button class="menu-item" onclick="chooseSkill('${s[0]}')"><span class="menu-icon">/</span><span><b>/${s[0]}</b><small>${s[2]}</small></span></button>`).join('');if(!matches.length)el.innerHTML+='<div class="menu-head">No matching approved skills</div>'}else if(type==='attach'){el.innerHTML=`<div class="menu-head">Add reference</div><button class="menu-item" onclick="document.getElementById('fileInput').click();hideAll()">▣ &nbsp; Upload image, video, audio or document</button><button class="menu-item" onclick="menu('refs')">◈ &nbsp; From project library</button><button class="menu-item" onclick="voiceHint()">♩ &nbsp; Record audio reference (planned)</button>`}else{el.innerHTML=`<div class="menu-head">Project references</div>`+refs.map(r=>`<button class="menu-item" onclick="chooseRef('${r.id}')"><span class="menu-icon">@</span><span><b>${r.label}</b><small>${r.role}</small></span></button>`).join('')}}
function toggleMenu(type){const id=type==='attach'?'attachMenu':'refsMenu';const el=document.getElementById(id);if(el&& !el.classList.contains('is-hidden'))hideAll();else menu(type)}
function openSkills(){const e=document.getElementById('composerInput');e.focus();if(!e.value.match(/\/[a-z-]*$/i))e.value=(e.value?e.value+' ':'')+'/';menu('skill','')}
function chooseSkill(s){skill=s;const e=document.getElementById('composerInput');e.value=e.value.replace(/(?:^|\s)\/[a-z-]*$/i,'').trim();const chip=document.createElement('span');chip.className='chip';chip.innerText='/'+s+' ×';chip.title='Remove skill';chip.onclick=()=>{chip.remove();skill=null};document.getElementById('chips').append(chip);hideAll();e.focus()}
function chooseRef(id){const r=refs.find(x=>x.id===id);if(r)notify(r.label+' referenced in message context');hideAll()}
function removeRef(id){refs=refs.filter(x=>x.id!==id);document.getElementById('chips').innerHTML=refsHTML()}
function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('is-hidden');setTimeout(()=>t.classList.add('is-hidden'),3500)}
function voiceHint(){hideAll();notify('Voice UX concept: microphone, transcription and audio replies require backend integration')}
function send(){const e=document.getElementById('composerInput');if(!e||!e.value.trim()&&!skill){notify('Write a message or choose a skill');return}notify('Prototype only: message not sent. No paid job was started.');}
function showModal(){document.getElementById('modal').classList.remove('is-hidden');document.getElementById('modal').innerHTML='<div class="modal"><h3>Prepare a targeted revision</h3><p>This would preserve approved character identity, wardrobe and camera position. A verified cost estimate and explicit authorization are required before generation.</p><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" disabled>Authorize generation</button></div></div>'}
function closeModal(){document.getElementById('modal').classList.add('is-hidden')}
function toggleActivity(){const e=document.getElementById('activity');e?.classList.toggle('is-hidden')}
const views={production,brief,mobile,'mobile-skills':mobileSkill,'mobile-attach':mobile};document.getElementById('app').innerHTML=`<div class="shell">${views[screen]?views[screen]():production()}</div>`;setup();
document.getElementById('fileInput').onchange=(ev)=>{const files=[...(ev.target.files||[])];for(const f of files){const id='up'+Date.now()+Math.random();refs.push({id,label:f.name,role:'Unassigned · select role'});const select=document.createElement('span');select.className='chip';select.innerHTML=`<span>${f.name}</span> <select class="ref-role-select"><option>Choose role</option>${['Character Identity','Wardrobe','Location','Visual Style','Prop','Shot Reference','Master Audio','Dialogue','Script / Dialogue'].map(a=>`<option>${a}</option>`).join('')}</select><button aria-label="Remove">×</button>`;select.querySelector('select').onchange=(e)=>{const r=refs.find(x=>x.id===id);if(r)r.role=e.target.value};select.querySelector('button').onclick=()=>{refs=refs.filter(x=>x.id!==id);select.remove()};document.getElementById('chips').append(select)}notify('Files selected in prototype. Upload to private storage not connected.');ev.target.value=''};
</script></body></html>
